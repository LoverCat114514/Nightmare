org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# On-device proot builds (arm64 phone, Ubuntu proot): uncomment to use the ARM
# aapt2 binary placed at /tmp/aapt2. Leave commented for normal desktop/CI
# builds -- AGP's maven aapt2 works there out of the box.
android.aapt2FromMavenOverride=/tmp/aapt2
