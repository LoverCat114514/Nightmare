# Builds the hexagon flavor of libvlm_engine.so (+ llama.cpp runtime libs and
# the libggml-htp skels) for the reverse-prompt module's NPU path.
#
# WHY THE WHOLE BUILD RUNS INSIDE THE TOOLCHAIN CONTAINER
# The snapdragon build needs the Hexagon SDK env (setup vars, hexagon-clang
# for the DSP skels) AND a pinned NDK. The snapdragon-toolchain image carries
# all of it prewired; upstream's own README builds via presets inside that
# image, and scripts/snapdragon/build.py is just that flow wrapped in docker
# run. Extracting the SDK to the runner instead (dit-engine's way) broke at
# include(hexagon_fun.cmake) with an empty-variable string(FIND) — the env the
# SDK's setup script exports is part of that wiring, so we run inside.
#
# ARTIFACT: a zip of shared libraries to drop into
# `app/src/main/jniLibs/arm64-v8a/` (replacing the CPU-only libvlm_engine.so):
#   libvlm_engine.so   — this repo's JNI bridge, built with -DVLM_ENABLE_HEXAGON
#   libllama.so libmtmd.so libggml*.so — llama.cpp runtime (mtmd vision stays CPU)
#   libggml-htp-v79.so — Hexagon v79 skel; FastRPC finds it via
#                        ADSP_LIBRARY_PATH, which the app points at
#                        nativeLibraryDir through VlmEngine.configureRuntime
#
# Upstream K-quant support (Q4_K_M via repack, PR #28994, merged 2026-09-16)
# ships in master, so the existing Q4_K_M GGUFs run as-is — accuracy trade-off
# (~27% PPL vs a native Q4_0 path) documented in that PR's discussions.
name: vlm-engine

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "ggml-org/llama.cpp ref to build (tag/branch/sha)"
        default: "master"
      hexagon_tag:
        description: "Tag of ghcr.io/snapdragon-toolchain/arm64-android"
        default: "v0.8"
      skels:
        description: "Extra htp skels to build beside v79, space-separated (v73/v75/v81/v85; blank = none)"
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: nightmare

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 ${{ inputs.llama_ref && format('--branch {0}', inputs.llama_ref) || '' }} \
            https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          echo "LLAMA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "llama.cpp $(git rev-parse HEAD)"

      # Pull retries: the registry flakes sometimes (a pull death before the
      # tee pipeline meant no build.log at all — annotation step "succeeded"
      # on a nonexistent file and we flew blind for a round).
      - name: Pull toolchain image
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== pull attempt $i ==="
            docker pull ghcr.io/snapdragon-toolchain/arm64-android:${{ inputs.hexagon_tag }} && { echo "PULL_OK"; break; }
            [ "$i" = 3 ] && { echo "::error::docker pull failed 3x"; exit 1; }
            sleep 30
          done

      # llama.cpp's own snapdragon flow: copy the preset, configure, build
      # (skels are part of the default build — the README's log shows
      # "Performing build step for 'htp-v73'" among normal targets), install,
      # then compile our JNI bridge against the installed libs. One container
      # session so the build tree survives for anything install misses
      # (libmtmd.so has no install rule on master).
      # Output always tees to build.log; on failure the tail is emitted as
      # ::error annotations (the run-logs API demands admin rights a
      # fine-grained token cannot carry).
      - name: Build inside the snapdragon toolchain container
        run: |
          GWS="$PWD"
          docker pull ghcr.io/snapdragon-toolchain/arm64-android:${{ inputs.hexagon_tag }}
          docker run --rm \
            -v "$GWS":/workspace -w /workspace/llama.cpp \
            ghcr.io/snapdragon-toolchain/arm64-android:${{ inputs.hexagon_tag }} \
            bash -c '
              set -euxo pipefail
              cp docs/backend/snapdragon/CMakeUserPresets.json .
              cmake --preset arm64-android-snapdragon-release -B build-snapdragon
              cmake --build build-snapdragon -j "$(nproc)"
              for V in v79 ${{ inputs.skels }}; do
                cmake --build build-snapdragon --target "htp-$V" -j "$(nproc)"
              done
              cmake --install build-snapdragon --prefix /workspace/pkg/llama.cpp
              mkdir -p /workspace/pkg/llama.cpp/lib /workspace/out
              # ⚠ Modern NDKs keep the sysroot under the prebuilt toolchain dir
              # (top-level $NDK/sysroot is gone in r29) — the libOpenCL probe in
              # the configure log confirms the real location.
              SYSROOT=/opt/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/sysroot
              NDK=/opt/android-ndk-r29
              test -f "$SYSROOT/usr/include/jni.h" || { echo "FATAL: jni.h missing at $SYSROOT"; ls "$SYSROOT/usr/include" | head; exit 1; }
              "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
                --target=aarch64-linux-android31 --sysroot="$SYSROOT" \
                -std=c++17 -O2 -DVLM_ENABLE_HEXAGON -fPIC -shared \
                -I include -I ggml/include -I tools/mtmd -I vendor/stb \
                /workspace/nightmare/app/src/main/cpp/vlm_engine.cpp \
                -L /workspace/pkg/llama.cpp/lib \
                -lllama -lmtmd -lggml -lggml-base -lggml-hexagon -llog \
                -o /workspace/out/libvlm_engine.so
              # Collect INSIDE the container: it sees its own outputs. Only the
              # runtime set ships — the install also drops libllama-*-impl.so
              # test helpers we do not want in the APK. The layout dump lands
              # in build.log's tail, so a failure shows exactly what exists.
              echo "--- installed libs ---"
              for f in libllama.so libmtmd.so libggml.so libggml-base.so libggml-cpu.so libggml-hexagon.so libggml-opencl.so; do
                S=/workspace/pkg/llama.cpp/lib/$f
                if [ -f "$S" ]; then cp "$S" /workspace/out/; else echo "WARN: $f not installed"; fi
              done
              for V in v79 ${{ inputs.skels }}; do
                S=/workspace/pkg/llama.cpp/lib/libggml-htp-$V.so
                if [ -f "$S" ]; then cp "$S" /workspace/out/; else echo "WARN: skel $V missing"; fi
              done
              echo "--- out/ ---"
              ls -la /workspace/out/
            ' 2>&1 | tee build.log

      - name: Annotate failure tail
        if: failure()
        run: |
          # docker's progress bars embed \r and control sequences that GitHub
          # drops when turning output into annotations — strip them and emit
          # only non-empty lines, or the tail never registers.
          tail -c 30000 build.log \
            | tr -d '\000-\010\013\014\016-\037\177' \
            | tr '\r' '\n' \
            | grep -a . | tail -n 40 \
            | sed 's/^/::error::/'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

      - name: Collect and package
        run: |
          set -euo pipefail
          # The container already gathered every .so into out/ (root-owned but
          # world-readable; ownership is irrelevant for zipping).
          mkdir -p out
          test -f out/libvlm_engine.so || { echo "::error::libvlm_engine.so missing"; ls -la out/ || true; exit 1; }
          ls -la out/
          cd out
          zip -j -X vlm-engine-llama${LLAMA_SHA:0:7}.zip *.so

      - name: Constants for the graft
        run: |
          cd out
          {
            echo "## vlm engine (hexagon) build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| llama.cpp | \`$LLAMA_SHA\` |"
            echo "| toolchain image | \`v${{ inputs.hexagon_tag }}\` |"
            echo
            echo '```'
            for S in *.so; do
              echo "$S  $(stat -c%s "$S") bytes  sha256 $(sha256sum "$S" | cut -c1-16)…"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlm-engine-hexagon-${{ env.LLAMA_SHA }}
          path: out/
          if-no-files-found: error
