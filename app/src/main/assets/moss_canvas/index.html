<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MOSS 空间布局画布</title>
<style>
:root{
  color-scheme: light;
  --bg:#F2F0F7;
  --card:#FFFFFF;
  --card-sub:#F8F7FC;
  --line:#E5E1EF;
  --fld:#D9D4E8;
  --txt:#17151F;
  --sub:#6E6A7A;
  --pri:#6D4AE0;
  --pri-d:#5B39CE;
  --pri-soft:#EFEAFB;
  --pri-soft2:#F7F4FE;
  --pri-line:#D8CCF5;
  --ok:#1CA672;
  --bad:#D64545;
  --r:18px;
  --r-sm:12px;
  --shadow:0 4px 18px rgba(109,74,224,0.06);
  --shadow-lg:0 8px 30px rgba(109,74,224,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--bg);
  color:var(--txt);
  font:15px/1.5 system-ui,-apple-system,"HarmonyOS Sans SC","MiSans","PingFang SC","Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
body{
  padding-bottom:120px;
}

/* ===== 顶部导航栏 ===== */
header{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(242,240,247,0.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top, 10px) + 8px) 16px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:32px;height:32px;border-radius:10px;background:var(--pri);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;
  box-shadow:0 3px 10px rgba(109,74,224,0.3);
}
.header-titles h1{font-size:17px;font-weight:900;letter-spacing:0.2px;color:var(--txt)}
.header-titles .badge{
  display:inline-block;font-size:10.5px;font-weight:700;color:var(--pri);
  background:var(--pri-soft);padding:1px 7px;border-radius:999px;margin-left:4px;
}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  border:1px solid var(--line);background:#fff;color:var(--txt);
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;transition:all .18s ease;box-shadow:0 2px 6px rgba(0,0,0,0.03);
}
.icon-btn:active{transform:scale(0.94);background:var(--pri-soft)}

/* ===== 主导航分段胶囊 ===== */
.tabs-wrap{padding:12px 16px 4px}
.seg-tabs{
  display:flex;background:#fff;border:1px solid var(--fld);border-radius:999px;padding:4px;
  box-shadow:0 2px 8px rgba(0,0,0,0.03);
}
.seg-tabs button{
  flex:1;border:none;background:none;padding:8px 0;border-radius:999px;
  font-weight:800;font-size:14px;color:var(--sub);cursor:pointer;transition:all .2s ease;
}
.seg-tabs button.on{
  background:var(--pri-soft);color:var(--pri);box-shadow:0 2px 6px rgba(109,74,224,0.12);
}

/* ===== 页面与容器 ===== */
.page{display:none;padding:10px 16px}.page.on{display:block}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:15.5px;font-weight:800;color:var(--txt);display:flex;align-items:center;gap:6px}
.card-title i{font-style:normal;font-size:17px}

/* ===== 标签与输入控件 ===== */
.field-label{
  display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 5px;
}
.input-row{display:flex;gap:10px;align-items:center}
.input-row>*{flex:1}
input,textarea,select{
  width:100%;background:var(--card-sub);border:1px solid var(--fld);color:var(--txt);
  border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:14px;outline:none;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{
  border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(109,74,224,0.12);
}

/* 尺寸预设与步进器 */
.size-stepper{
  display:flex;align-items:center;background:var(--card-sub);border:1px solid var(--fld);
  border-radius:var(--r-sm);overflow:hidden;
}
.size-stepper input{
  border:none;background:transparent;text-align:center;font-weight:800;font-size:15px;padding:8px 4px;
}
.size-stepper button{
  border:none;background:none;width:34px;height:38px;color:var(--sub);font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.size-stepper button:active{background:rgba(109,74,224,0.1);color:var(--pri)}
.swap-btn{
  border:1px solid var(--fld);background:#fff;color:var(--pri);width:40px;height:40px;
  border-radius:12px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  flex:none;box-shadow:0 2px 6px rgba(0,0,0,0.03);
}
.swap-btn:active{transform:scale(0.92);background:var(--pri-soft)}

/* 预设比例 Chips */
.ratio-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ratio-chip{
  border:1px solid var(--line);background:var(--card-sub);color:var(--sub);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
  transition:all .18s;
}
.ratio-chip.on{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri)}
.ratio-chip:active{transform:scale(0.95)}

/* 单选分段芯片 */
.seg-pills{display:flex;gap:8px;margin-top:4px}
.seg-pill{
  flex:1;border:1px solid var(--line);background:var(--card-sub);color:var(--sub);
  border-radius:10px;padding:9px 0;font-size:13.5px;font-weight:700;cursor:pointer;
  text-align:center;transition:all .18s;
}
.seg-pill.on{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri);font-weight:800}

/* ===== 画布区域 ===== */
.canvas-card{padding:14px}
.canvas-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
}
.canvas-tools-left{display:flex;gap:6px}
.tool-btn{
  border:1px solid var(--line);background:var(--card-sub);color:var(--sub);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;
  cursor:pointer;transition:all .18s;white-space:nowrap;flex:none;user-select:none;
}
.tool-btn.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 3px 10px rgba(109,74,224,0.25)}
.tool-btn.danger{color:var(--bad)}
.tool-btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

#wrap{
  position:relative;
  touch-action:none;
  border:1.5px solid var(--fld);
  border-radius:16px;
  overflow:hidden;
  background:#121018;
  margin:0 auto;
  box-shadow:inset 0 2px 10px rgba(0,0,0,0.15);
}
#cv{display:block;width:100%}
#wrap.draw-mode{cursor:crosshair}
#wrap.select-mode{cursor:default}

/* 浮动画框元素 */
.box{
  position:absolute;
  border:2.5px solid #a855f7;
  background:rgba(168,85,247,0.18);
  border-radius:4px;
  pointer-events:auto;
  box-sizing:border-box;
  transition:border-color .15s, background .15s;
}
.box.sel{
  border-color:#F59E0B !important;
  background:rgba(245,158,11,0.25) !important;
  box-shadow:0 0 0 1px #F59E0B, 0 4px 14px rgba(245,158,11,0.3);
  z-index:10;
}
.box .tag{
  position:absolute;top:-24px;left:-2.5px;color:#fff;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:6px;white-space:nowrap;max-width:170px;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.box.sel .tag{background:#D97706 !important}
.box-handle{
  position:absolute;width:12px;height:12px;background:#fff;border:2.5px solid #F59E0B;
  border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3);display:none;
}
.box.sel .box-handle{display:block}
.handle-tl{top:-6px;left:-6px;cursor:nwse-resize}
.handle-tr{top:-6px;right:-6px;cursor:nesw-resize}
.handle-bl{bottom:-6px;left:-6px;cursor:nesw-resize}
.handle-br{bottom:-6px;right:-6px;cursor:nwse-resize}

.canvas-hint{
  font-size:12px;color:var(--sub);margin-top:10px;text-align:center;display:flex;align-items:center;
  justify-content:center;gap:5px;
}
.canvas-hint svg{width:14px;height:14px;fill:currentColor}

/* ===== 元素图层列表 ===== */
.item-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s;
}
.item-card.sel{
  border-color:var(--pri);
  box-shadow:0 0 0 1px var(--pri), var(--shadow-lg);
  background:var(--pri-soft2);
}
.item-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.item-badge{
  font-size:13px;font-weight:900;color:#fff;background:var(--pri);
  padding:3px 10px;border-radius:999px;flex:none;
}
.type-chips{display:flex;gap:5px;flex:1}
.type-chip{
  flex:1;border:1px solid var(--line);background:var(--card-sub);color:var(--sub);
  border-radius:999px;padding:4px 0;font-size:12px;font-weight:700;cursor:pointer;text-align:center;
}
.type-chip.on{color:#fff;font-weight:800;border:none}
.btn-del{
  width:32px;height:32px;border:1px solid var(--line);background:var(--card-sub);color:var(--bad);
  border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.btn-del:active{background:rgba(214,69,69,0.15)}

.coord-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;
}
.coord-field{display:flex;flex-direction:column}
.coord-field span{font-size:10.5px;font-weight:800;color:var(--sub);margin-bottom:2px}
.coord-field input{
  padding:6px;font-size:12.5px;font-weight:800;text-align:center;border-radius:8px;
}

/* ===== 提示词编译结果 ===== */
.compiled-box{
  background:var(--card-sub);border:1px solid var(--fld);border-radius:var(--r-sm);
  padding:12px;font:12.5px/1.5 monospace;word-break:break-all;color:var(--pri);
  max-height:120px;overflow-y:auto;user-select:all;margin-top:6px;
}
.compiled-box.error{color:var(--bad);background:#FFF4F4;border-color:#FBC4C4}

/* ===== 底部悬浮控制台 ===== */
.dock-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:40;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(env(safe-area-inset-bottom, 10px) + 8px);
  display:flex;
  gap:10px;
  box-shadow:0 -4px 20px rgba(0,0,0,0.06);
}
.dock-btn-main{
  flex:2;
  border:none;
  background:linear-gradient(135deg,#7C4DFF,#5B39CE);
  color:#fff;
  border-radius:var(--r-sm);
  padding:14px 18px;
  font-size:15px;
  font-weight:900;
  letter-spacing:0.3px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 16px rgba(109,74,224,0.35);
  transition:all .18s ease;
}
.dock-btn-main:active{transform:scale(0.97);box-shadow:0 2px 8px rgba(109,74,224,0.25)}
.dock-btn-sub{
  flex:1;
  border:1.5px solid var(--pri-line);
  background:var(--pri-soft);
  color:var(--pri);
  border-radius:var(--r-sm);
  padding:14px 14px;
  font-size:14.5px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all .18s ease;
}
.dock-btn-sub:active{transform:scale(0.97);background:#E4DBF8}

/* ===== Toast 提示条 ===== */
.toast{
  position:fixed;left:50%;bottom:95px;transform:translateX(-50%);
  background:#1E182A;color:#fff;padding:10px 22px;border-radius:999px;
  font-size:13.5px;font-weight:700;opacity:0;transition:.22s ease;
  pointer-events:none;z-index:99;max-width:88%;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* 折叠小控件 */
details summary{
  cursor:pointer;color:var(--pri);font-size:13.5px;font-weight:800;
  padding:4px 0;outline:none;user-select:none;
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header>
  <div class="header-left">
    <button class="icon-btn" onclick="closeCanvas()" title="返回" style="margin-right:2px">✕</button>
    <div class="header-logo">🎛️</div>
    <div class="header-titles">
      <h1>MOSS 布局画布<span class="badge">NewUI</span></h1>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportDraft()" title="查看/导出草稿代码">📄</button>
  </div>
</header>

<!-- 主分段标签 -->
<div class="tabs-wrap">
  <div class="seg-tabs">
    <button id="t-cv" class="on" onclick="switchPage('cv')">🎨 画框画板</button>
    <button id="t-js" onclick="switchPage('js')">📄 草稿 JSON</button>
  </div>
</div>

<!-- ============ 画板页面 ============ -->
<div class="page on" id="p-cv">

  <!-- 1. 尺寸与分辨率卡片 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i>📐</i>生成尺寸与构图比例</div>
    </div>
    <div class="input-row">
      <div class="size-stepper">
        <button onclick="stepSize('W', -16)">−</button>
        <input id="W" type="number" step="16" min="256" value="896" onchange="onSizeChanged()">
        <button onclick="stepSize('W', 16)">+</button>
      </div>
      <button class="swap-btn" onclick="swapWH()" title="交换宽高">⇄</button>
      <div class="size-stepper">
        <button onclick="stepSize('H', -16)">−</button>
        <input id="H" type="number" step="16" min="256" value="1152" onchange="onSizeChanged()">
        <button onclick="stepSize('H', 16)">+</button>
      </div>
    </div>
    <div class="ratio-chips" id="ratioChips">
      <button class="ratio-chip" onclick="setPresetSize(1024,1024)">1:1 默认 (1024²)</button>
      <button class="ratio-chip on" onclick="setPresetSize(896,1152)">3:4 人像 (896×1152)</button>
      <button class="ratio-chip" onclick="setPresetSize(768,1344)">9:16 壁纸 (768×1344)</button>
      <button class="ratio-chip" onclick="setPresetSize(1152,896)">4:3 风景 (1152×896)</button>
      <button class="ratio-chip" onclick="setPresetSize(1344,768)">16:9 宽屏 (1344×768)</button>
    </div>
  </div>

  <!-- 2. 画布交互区域 -->
  <div class="card canvas-card">
    <div class="canvas-toolbar">
      <div class="canvas-tools-left">
        <button class="tool-btn on" id="btnDraw" onclick="setMode('draw')">✏️ 绘制画框</button>
        <button class="tool-btn" id="btnSelect" onclick="setMode('select')">👆 移动调整</button>
      </div>
      <button class="tool-btn danger" id="btnClear" onclick="onClearClick()">🧹 清空</button>
    </div>

    <!-- 真实画布容器 -->
    <div id="wrap" class="draw-mode">
      <canvas id="cv"></canvas>
    </div>

    <div class="canvas-hint" id="canvasHint">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      拖拽可自由框定位置 · 点选框体可拉伸四角把手或拖动位置
    </div>
  </div>

  <!-- 3. 全局场景描述配置 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i>📝</i>场景总述与风格元词</div>
    </div>
    <label class="field-label" style="margin-top:0">总述描述（整图综合场景，例如人物关系、环境与氛围）</label>
    <textarea id="cap" rows="2" placeholder="例如：anime key visual, a silver-haired girl floating underwater, glowing jellyfish, high contrast"></textarea>

    <label class="field-label">画布版式（Layout Canvas Type）</label>
    <div class="seg-pills" id="canvasPills">
      <div class="seg-pill on" data-v="single" onclick="setCanvasType('single')">🖼️ 单图单框</div>
      <div class="seg-pill" data-v="multi_panel" onclick="setCanvasType('multi_panel')">🎞️ 分镜排版</div>
      <div class="seg-pill" data-v="collage" onclick="setCanvasType('collage')">🧩 贴纸拼贴</div>
    </div>

    <div class="input-row" style="margin-top:10px">
      <div>
        <label class="field-label">风格修饰词 meta（逗号分隔）</label>
        <input id="meta" placeholder="例如：masterpiece, anime art">
      </div>
      <div>
        <label class="field-label">调色板 palette（#十六进制色）</label>
        <input id="pal" placeholder="例如：#1a103c, #8b5cf6">
      </div>
    </div>
  </div>

  <!-- 4. 画框元素列表 -->
  <div class="card-header" style="margin:16px 4px 10px">
    <div class="card-title"><i>📦</i>画框元素管理 (<span id="boxCount">0</span>)</div>
  </div>
  <div id="itemsList"></div>

  <!-- 5. 提示词编译预览 -->
  <div class="card">
    <details>
      <summary>🔍 查看发给 MOSS 模型的结构化编译结果</summary>
      <div id="compiled" class="compiled-box">（暂无元素，将作为普通提示词发送）</div>
    </details>
  </div>

</div>

<!-- ============ 草稿代码页面 ============ -->
<div class="page" id="p-js">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i>📋</i>草稿 JSON 导入 / 导出</div>
    </div>
    <label class="field-label" style="margin-top:0">粘贴外部 ComfyUI / MOSS 草稿 JSON</label>
    <textarea id="jsIn" rows="12" style="font-family:monospace;font-size:13px" placeholder='{"summary":{"caption":"..."},"items":[{"label":"character","caption":"a girl","bbox":[100,100,500,700]}]}'></textarea>
    <div class="input-row" style="margin-top:12px">
      <button class="dock-btn-main" style="padding:10px 14px;font-size:14px" onclick="importDraft()">📥 导入到画板</button>
      <button class="dock-btn-sub" style="padding:10px 14px;font-size:14px" onclick="exportDraft()">📤 导出当前草稿</button>
    </div>
  </div>
</div>

<!-- 底部常驻悬浮控制台 -->
<div class="dock-bar">
  <button class="dock-btn-sub" onclick="copyCompiled()">
    <span>📋 复制提示词</span>
  </button>
  <button class="dock-btn-main" onclick="sendToNightmare()">
    <span>✨ 编译并应用到画布</span>
  </button>
</div>

<!-- 吐司通知条 -->
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ================= 状态管理 ================= */
const S = {
  w: 896,
  h: 1152,
  canvas: "single",
  items: [],
  sel: -1,
  mode: "draw", // "draw" | "select"
};

// 元素类别配色体系（与NewUI清爽调性一致）
const LBL_CONFIG = {
  character: { name: "角色", color: "#0284C7", fill: "rgba(2,132,199,0.22)", border: "#0284C7" },
  object:    { name: "物体", color: "#6D4AE0", fill: "rgba(109,74,224,0.22)", border: "#6D4AE0" },
  text:      { name: "文字", color: "#D97706", fill: "rgba(217,119,6,0.22)", border: "#D97706" }
};

const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

function closeCanvas() {
  if (window.Nightmare && window.Nightmare.close) {
    window.Nightmare.close();
  } else {
    window.history.back();
  }
}

function switchPage(page) {
  $("p-cv").classList.toggle("on", page === "cv");
  $("p-js").classList.toggle("on", page === "js");
  $("t-cv").classList.toggle("on", page === "cv");
  $("t-js").classList.toggle("on", page === "js");
  if (page === "cv") renderCanvas();
}

/* ================= MOSS 布局编译器 (忠实移植原实现) ================= */
const SIZE_MULT = 16, LABELS = ["object", "character", "text"], CANVASES = ["single", "multi_panel", "collage"];
const SUMMARY_F = ["caption", "meta", "canvas", "palette"], ITEM_F = ["label", "caption", "bbox", "text", "tags", "palette", "color"], DRAFT_F = ["width", "height", "bbox_coord_space", "bbox_format", "summary", "items"];
class LayoutError extends Error {}

function sizeOk(v) { return Number.isInteger(v) && v > 0 && v % SIZE_MULT === 0; }

function centered(b, w, h) {
  if (!Array.isArray(b) || b.length !== 4) throw new LayoutError("bbox 必须是 [x1,y1,x2,y2]");
  for (const v of b) if (typeof v !== "number" || !isFinite(v)) throw new LayoutError("bbox 必须是四个数字");
  let [x1, y1, x2, y2] = b;
  if (!(0 <= x1 && x1 < x2 && x2 <= w && 0 <= y1 && y1 < y2 && y2 <= h)) throw new LayoutError(`bbox 超出 ${w}x${h} 画布`);
  const r9 = v => Math.round(v * 1e9) / 1e9;
  const out = [Math.floor(r9(y1)) - Math.floor(h / 2), Math.floor(r9(x1)) - Math.floor(w / 2), Math.ceil(r9(y2)) - Math.floor(h / 2), Math.ceil(r9(x2)) - Math.floor(w / 2)];
  if (!(out[0] < out[2] && out[1] < out[3])) throw new LayoutError("画框有效面积太小");
  return out;
}

function parseDraftLoose(text) {
  try { const v = JSON.parse(text); if (v && typeof v === "object" && !Array.isArray(v)) return v; } catch (e) {}
  // 容错搜索 JSON 块
  for (let s = 0; s < text.length; s++) {
    if (text[s] !== "{") continue;
    let d = 0, str = false, esc = false;
    for (let i = s; i < text.length; i++) {
      const c = text[i];
      if (str) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') str = false; continue; }
      if (c === '"') str = true;
      else if (c === "{") d++;
      else if (c === "}") {
        d--;
        if (d === 0) {
          try {
            const v = JSON.parse(text.slice(s, i + 1));
            if (v && typeof v === "object") return v;
          } catch (_) {}
          break;
        }
      }
    }
  }
  return null;
}

function fitItems(items, w, h) {
  let hw = 0, hh = 0;
  for (const it of items) {
    const b = it.bbox; if (!Array.isArray(b) || b.length !== 4) continue;
    hw = Math.max(hw, Math.abs(b[0] - w / 2), Math.abs(b[2] - w / 2));
    hh = Math.max(hh, Math.abs(b[1] - h / 2), Math.abs(b[3] - h / 2));
  }
  if (!hw || !hh || (hw <= w / 2 && hh <= h / 2)) return items;
  const sc = Math.min(w / 2 / hw, h / 2 / hh);
  return items.map(it => {
    const b = it.bbox; if (!Array.isArray(b) || b.length !== 4) return it;
    const f = v => (v - w / 2) * sc + w / 2, g = v => (v - h / 2) * sc + h / 2;
    return { ...it, bbox: [f(b[0]), g(b[1]), f(b[2]), g(b[3])] };
  });
}

function loadDraft(raw, w, h) {
  let d = raw;
  if (typeof raw === "string") {
    const s = raw.trim();
    if (!s) return { width: w, height: h, bbox_coord_space: "abs", bbox_format: "xyxy", summary: { caption: "", canvas: "single" }, items: [] };
    d = parseDraftLoose(s);
    if (!d) throw new LayoutError("无法识别合法 JSON");
  }
  return {
    width: d.width ?? w,
    height: d.height ?? h,
    bbox_coord_space: d.bbox_coord_space || "abs",
    bbox_format: d.bbox_format || "xyxy",
    summary: d.summary || { caption: "" },
    items: fitItems(d.items || [], d.width || w, d.height || h)
  };
}

function compileLayout(draft) {
  const cw = draft.width, ch = draft.height;
  if (!sizeOk(cw) || !sizeOk(ch)) throw new LayoutError("宽高尺寸必须是 16 的倍数");
  const items = draft.items;
  if (!Array.isArray(items) || items.length === 0) {
    return String(draft.summary?.caption ?? "").trim();
  }
  const sm = draft.summary || {};
  const out = [];
  items.forEach((it, i) => {
    if (!it.label || !LABELS.includes(it.label)) throw new LayoutError(`元素 #${i + 1} 类别有误`);
    if (it.label === "text" && (!it.text || !it.text.trim())) throw new LayoutError(`元素 #${i + 1} (文字) 缺少文字内容`);
    const o = { ...it, bbox: centered(it.bbox, cw, ch) };
    out.push(o);
  });
  return JSON.stringify({
    summary: sm,
    items: out,
    bbox_coord_space: "abs_centralized",
    bbox_format: "yxyx"
  });
}

/* ================= 界面交互与画板渲染 ================= */
function onSizeChanged() {
  S.w = parseInt($("W").value) || 896;
  S.h = parseInt($("H").value) || 1152;
  // 保证是16的倍数
  S.w = Math.max(256, Math.round(S.w / 16) * 16);
  S.h = Math.max(256, Math.round(S.h / 16) * 16);
  $("W").value = S.w;
  $("H").value = S.h;
  clampBoxes();
  renderCanvas();
  renderItemsList();
  compileAndUpdate();
  saveState();
  if (window.Nightmare?.setSize) window.Nightmare.setSize(S.w, S.h);
}

function stepSize(id, delta) {
  const el = $(id);
  el.value = (parseInt(el.value) || 1024) + delta;
  onSizeChanged();
}

function swapWH() {
  const t = $("W").value;
  $("W").value = $("H").value;
  $("H").value = t;
  onSizeChanged();
}

function setPresetSize(w, h) {
  $("W").value = w;
  $("H").value = h;
  // 更新预设 chips 的激活态
  document.querySelectorAll(".ratio-chip").forEach(c => {
    c.classList.toggle("on", c.textContent.includes(`${w}×${h}`) || (w === 1024 && h === 1024 && c.textContent.includes("1024²")));
  });
  onSizeChanged();
}

function setMode(mode) {
  S.mode = mode;
  $("btnDraw").classList.toggle("on", mode === "draw");
  $("btnSelect").classList.toggle("on", mode === "select");
  $("wrap").className = mode === "draw" ? "draw-mode" : "select-mode";
  const hint = $("canvasHint");
  if (hint) {
    if (mode === "draw") {
      hint.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> 连续绘制模式：在画布上随意拖拽即可连续画新框，无需频繁切换`;
    } else {
      hint.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> 移动调整模式：点选框体拖动改变位置，拉伸四角手柄调整尺寸`;
    }
  }
}

function setCanvasType(type) {
  S.canvas = type;
  document.querySelectorAll("#canvasPills .seg-pill").forEach(p => {
    p.classList.toggle("on", p.dataset.v === type);
  });
  compileAndUpdate();
  saveState();
}

function clampBoxes() {
  S.items.forEach(it => {
    it.bbox[0] = Math.max(0, Math.min(it.bbox[0], S.w - 16));
    it.bbox[1] = Math.max(0, Math.min(it.bbox[1], S.h - 16));
    it.bbox[2] = Math.max(it.bbox[0] + 16, Math.min(it.bbox[2], S.w));
    it.bbox[3] = Math.max(it.bbox[1] + 16, Math.min(it.bbox[3], S.h));
  });
}

function renderCanvas() {
  const wrap = $("wrap"), cv = $("cv");
  const maxW = wrap.parentElement.clientWidth - 28;
  const aspect = S.w / S.h;
  
  let targetW = maxW;
  let targetH = Math.round(targetW / aspect);
  // 视口高度保护
  if (targetH > window.innerHeight * 0.52) {
    targetH = Math.round(window.innerHeight * 0.52);
    targetW = Math.round(targetH * aspect);
  }
  wrap.style.width = targetW + "px";
  wrap.style.height = targetH + "px";

  const scale = targetW / S.w;
  cv.width = targetW;
  cv.height = targetH;
  cv.style.height = targetH + "px";

  // 绘制高级深色点阵网格背景
  const g = cv.getContext("2d");
  g.fillStyle = "#121018";
  g.fillRect(0, 0, targetW, targetH);

  // 网格线
  g.strokeStyle = "rgba(255, 255, 255, 0.05)";
  g.lineWidth = 1;
  const cols = 8, rows = Math.round(8 / aspect);
  for (let x = 0; x <= targetW; x += targetW / cols) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, targetH); g.stroke();
  }
  for (let y = 0; y <= targetH; y += targetH / (rows || 8)) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(targetW, y); g.stroke();
  }

  // 清除旧 DOM 框
  wrap.querySelectorAll(".box").forEach(n => n.remove());

  // 生成画框 DOM
  S.items.forEach((it, i) => {
    const b = it.bbox;
    const cfg = LBL_CONFIG[it.label] || LBL_CONFIG.object;
    const isSel = (i === S.sel);

    const d = document.createElement("div");
    d.className = "box" + (isSel ? " sel" : "");
    d.style.left = (b[0] * scale) + "px";
    d.style.top = (b[1] * scale) + "px";
    d.style.width = ((b[2] - b[0]) * scale) + "px";
    d.style.height = ((b[3] - b[1]) * scale) + "px";
    d.style.borderColor = cfg.border;
    d.style.background = cfg.fill;

    // 顶部胶囊标签
    const tg = document.createElement("span");
    tg.className = "tag";
    tg.textContent = `#${i + 1} ${cfg.name}${it.caption ? " · " + it.caption.slice(0, 10) : ""}`;
    tg.style.background = cfg.color;
    d.appendChild(tg);

    // 四角缩放手柄 (选中时展现)
    ["tl", "tr", "bl", "br"].forEach(pos => {
      const h = document.createElement("div");
      h.className = `box-handle handle-${pos}`;
      h.dataset.handle = pos;
      h.dataset.index = i;
      d.appendChild(h);
    });

    d.onpointerdown = e => {
      if (e.target.dataset.handle) return; // 让手柄事件优先
      e.stopPropagation();
      selectBox(i);
      if (S.mode === "select") {
        startMoveBox(e, i, scale);
      }
    };

    wrap.appendChild(d);
  });

  $("boxCount").textContent = S.items.length;
}

/* 交互事件监听：绘制、移动与变形手柄 */
let activeDrag = null;

const wrapEl = $("wrap");
wrapEl.addEventListener("pointerdown", e => {
  const handle = e.target.dataset.handle;
  if (handle) {
    e.stopPropagation();
    startResizeHandle(e, parseInt(e.target.dataset.index), handle);
    return;
  }
  if (e.target.closest(".box") && S.mode === "select") return;

  // 绘制新画框模式
  if (S.mode === "draw") {
    const r = wrapEl.getBoundingClientRect();
    const sc = S.w / r.width;
    activeDrag = {
      type: "create",
      x0: (e.clientX - r.left) * sc,
      y0: (e.clientY - r.top) * sc,
      el: null
    };
    wrapEl.setPointerCapture(e.pointerId);
  }
});

wrapEl.addEventListener("pointermove", e => {
  if (!activeDrag) return;
  const r = wrapEl.getBoundingClientRect();
  const sc = S.w / r.width;
  const x = Math.max(0, Math.min(S.w, (e.clientX - r.left) * sc));
  const y = Math.max(0, Math.min(S.h, (e.clientY - r.top) * sc));

  if (activeDrag.type === "create") {
    if (!activeDrag.el) {
      activeDrag.el = document.createElement("div");
      activeDrag.el.className = "box sel";
      activeDrag.el.style.borderColor = "#F59E0B";
      wrapEl.appendChild(activeDrag.el);
    }
    const b = [
      Math.min(activeDrag.x0, x),
      Math.min(activeDrag.y0, y),
      Math.max(activeDrag.x0, x),
      Math.max(activeDrag.y0, y)
    ];
    activeDrag.el.style.left = (b[0] / sc) + "px";
    activeDrag.el.style.top = (b[1] / sc) + "px";
    activeDrag.el.style.width = ((b[2] - b[0]) / sc) + "px";
    activeDrag.el.style.height = ((b[3] - b[1]) / sc) + "px";
    activeDrag.b = b;
  } else if (activeDrag.type === "move") {
    const dx = x - activeDrag.startX;
    const dy = y - activeDrag.startY;
    const orig = activeDrag.origB;
    const bw = orig[2] - orig[0], bh = orig[3] - orig[1];
    let nx1 = Math.max(0, Math.min(S.w - bw, orig[0] + dx));
    let ny1 = Math.max(0, Math.min(S.h - bh, orig[1] + dy));
    S.items[activeDrag.index].bbox = [Math.round(nx1), Math.round(ny1), Math.round(nx1 + bw), Math.round(ny1 + bh)];
    renderCanvas();
    updateItemCoords(activeDrag.index);
  } else if (activeDrag.type === "resize") {
    const b = [...activeDrag.origB];
    const h = activeDrag.handle;
    if (h.includes("l")) b[0] = Math.min(b[2] - 16, Math.max(0, x));
    if (h.includes("r")) b[2] = Math.max(b[0] + 16, Math.min(S.w, x));
    if (h.includes("t")) b[1] = Math.min(b[3] - 16, Math.max(0, y));
    if (h.includes("b")) b[3] = Math.max(b[1] + 16, Math.min(S.h, y));
    S.items[activeDrag.index].bbox = [Math.round(b[0]), Math.round(b[1]), Math.round(b[2]), Math.round(b[3])];
    renderCanvas();
    updateItemCoords(activeDrag.index);
  }
});

wrapEl.addEventListener("pointerup", e => {
  if (!activeDrag) return;
  const cur = activeDrag;
  activeDrag = null;
  if (cur.type === "create") {
    if (cur.el) cur.el.remove();
    if (cur.b) {
      const w = cur.b[2] - cur.b[0], h = cur.b[3] - cur.b[1];
      if (w >= 16 && h >= 16) {
        S.items.push({
          label: "character",
          caption: "",
          bbox: [Math.round(cur.b[0]), Math.round(cur.b[1]), Math.round(cur.b[2]), Math.round(cur.b[3])]
        });
        S.sel = S.items.length - 1;
        renderCanvas();
        renderItemsList();
        compileAndUpdate();
        saveState();
        // ⭐ 保持绘制模式，不强制切换，支持连续画新框！
        return;
      }
    }
  }
  compileAndUpdate();
  saveState();
});

function startMoveBox(e, index, scale) {
  const r = wrapEl.getBoundingClientRect();
  const sc = S.w / r.width;
  activeDrag = {
    type: "move",
    index: index,
    startX: (e.clientX - r.left) * sc,
    startY: (e.clientY - r.top) * sc,
    origB: [...S.items[index].bbox]
  };
  wrapEl.setPointerCapture(e.pointerId);
}

function startResizeHandle(e, index, handle) {
  const r = wrapEl.getBoundingClientRect();
  const sc = S.w / r.width;
  activeDrag = {
    type: "resize",
    index: index,
    handle: handle,
    origB: [...S.items[index].bbox]
  };
  wrapEl.setPointerCapture(e.pointerId);
}

function selectBox(i) {
  S.sel = i;
  renderCanvas();
  renderItemsList();
  // 滚动到对应元素
  const target = document.getElementById("item-" + i);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function updateItemCoords(i) {
  const it = S.items[i];
  if (!it) return;
  ["0", "1", "2", "3"].forEach(idx => {
    const inp = document.querySelector(`[data-card-idx="${i}"] [data-coord="${idx}"]`);
    if (inp) inp.value = it.bbox[parseInt(idx)];
  });
}

function renderItemsList() {
  const list = $("itemsList");
  list.innerHTML = "";

  if (S.items.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:26px 12px;color:var(--sub);font-size:13px">画布上暂无画框，在上方画布拖拽即可快速创建</div>`;
    return;
  }

  S.items.forEach((it, i) => {
    const isSel = (i === S.sel);
    const card = document.createElement("div");
    card.id = "item-" + i;
    card.className = "item-card" + (isSel ? " sel" : "");
    card.dataset.cardIdx = i;

    const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    card.innerHTML = `
      <div class="item-header">
        <span class="item-badge">#${i + 1}</span>
        <div class="type-chips">
          ${LABELS.map(lbl => {
            const cfg = LBL_CONFIG[lbl];
            const active = (it.label === lbl);
            return `<button class="type-chip ${active ? "on" : ""}" data-lbl="${lbl}" style="${active ? `background:${cfg.color}` : ""}">${cfg.name} (${lbl})</button>`;
          }).join("")}
        </div>
        <button class="btn-del" title="删除画框" data-action="del">🗑</button>
      </div>

      <label class="field-label" style="margin-top:4px">局部提示词（描述该位置的物体/角色特征）</label>
      <input data-prop="caption" placeholder="例如：a silver-haired warrior holding a glowing sword" value="${esc(it.caption)}">

      ${it.label === "text" ? `
        <label class="field-label">画面文字内容（显示在图片中的文字）</label>
        <input data-prop="text" placeholder="例如：NIGHTMARE" value="${esc(it.text || "")}">
      ` : ""}

      <div class="coord-grid">
        <div class="coord-field"><span>左 X1</span><input data-coord="0" type="number" value="${it.bbox[0]}"></div>
        <div class="coord-field"><span>顶 Y1</span><input data-coord="1" type="number" value="${it.bbox[1]}"></div>
        <div class="coord-field"><span>右 X2</span><input data-coord="2" type="number" value="${it.bbox[2]}"></div>
        <div class="coord-field"><span>底 Y2</span><input data-coord="3" type="number" value="${it.bbox[3]}"></div>
      </div>
    `;

    // 选中与交互绑定
    card.onclick = e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
      selectBox(i);
    };

    // 切换类型
    card.querySelectorAll("[data-lbl]").forEach(b => {
      b.onclick = () => {
        it.label = b.dataset.lbl;
        if (it.label !== "text") delete it.text;
        renderCanvas();
        renderItemsList();
        compileAndUpdate();
        saveState();
      };
    });

    // 删除
    card.querySelector("[data-action='del']").onclick = e => {
      e.stopPropagation();
      S.items.splice(i, 1);
      S.sel = -1;
      renderCanvas();
      renderItemsList();
      compileAndUpdate();
      saveState();
      toast("已删除画框 #" + (i + 1));
    };

    // 输入绑定
    const capInp = card.querySelector("[data-prop='caption']");
    if (capInp) capInp.oninput = e => { it.caption = e.target.value; compileAndUpdate(); saveState(); };

    const txtInp = card.querySelector("[data-prop='text']");
    if (txtInp) txtInp.oninput = e => { it.text = e.target.value; compileAndUpdate(); saveState(); };

    card.querySelectorAll("[data-coord]").forEach(inp => {
      inp.onchange = () => {
        const val = parseInt(inp.value) || 0;
        it.bbox[parseInt(inp.dataset.coord)] = val;
        clampBoxes();
        renderCanvas();
        compileAndUpdate();
        saveState();
      };
    });

    list.appendChild(card);
  });
}

// 清空画框按钮（二次确认防止误触）
let clearTimer = null;
function onClearClick() {
  const btn = $("btnClear");
  if (!S.items.length) { toast("画布已经是空的"); return; }
  if (btn.classList.contains("armed")) {
    clearTimeout(clearTimer);
    btn.classList.remove("armed");
    btn.textContent = "🧹 清空";
    S.items = [];
    S.sel = -1;
    renderCanvas();
    renderItemsList();
    compileAndUpdate();
    saveState();
    toast("画布已重置清空");
    return;
  }
  btn.classList.add("armed");
  btn.textContent = "再次点击确认";
  clearTimer = setTimeout(() => {
    btn.classList.remove("armed");
    btn.textContent = "🧹 清空";
  }, 2400);
}

/* ================= 收集与编译 ================= */
function collectCurrentDraft() {
  const sm = { caption: $("cap").value || "" };
  if (S.canvas && S.canvas !== "single") sm.canvas = S.canvas;
  const metaVal = $("meta").value.split(",").map(s => s.trim()).filter(Boolean);
  if (metaVal.length) sm.meta = metaVal;
  const palVal = $("pal").value.split(",").map(s => s.trim()).filter(Boolean);
  if (palVal.length) sm.palette = palVal;

  return {
    width: S.w,
    height: S.h,
    bbox_coord_space: "abs",
    bbox_format: "xyxy",
    summary: sm,
    items: S.items.map(it => {
      const o = { label: it.label, caption: it.caption || "", bbox: [...it.bbox] };
      if (it.text) o.text = it.text;
      return o;
    })
  };
}

let compiledOutput = "";
function compileAndUpdate() {
  const box = $("compiled");
  try {
    const draft = collectCurrentDraft();
    compiledOutput = compileLayout(draft);
    box.textContent = compiledOutput || "（当前无画框，将以普通总述文本提示词发送）";
    box.className = "compiled-box";
    return compiledOutput;
  } catch (err) {
    compiledOutput = "";
    box.textContent = "⚠ 编译校验失败: " + err.message;
    box.className = "compiled-box error";
    return null;
  }
}

function copyCompiled() {
  const t = compileAndUpdate();
  if (t === null) { toast("请先检查并修正错误"); return; }
  navigator.clipboard.writeText(t).then(() => {
    toast("提示词已复制到剪贴板！");
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("提示词已复制！");
  });
}

function sendToNightmare() {
  const t = compileAndUpdate();
  if (t === null) { toast("编译有误，请先修正"); return; }
  const d = collectCurrentDraft();
  if (window.Nightmare?.saveDraft) {
    window.Nightmare.saveDraft(t, d.width, d.height);
    return;
  }
  // 浏览器降级：复制
  copyCompiled();
}

/* ================= 草稿 JSON 导入与导出 ================= */
function importDraft() {
  try {
    const text = $("jsIn").value.trim();
    if (!text) { toast("请先粘贴 JSON 内容"); return; }
    const d = loadDraft(text, S.w, S.h);
    S.w = parseInt(d.width) || S.w;
    S.h = parseInt(d.height) || S.h;
    $("W").value = S.w;
    $("H").value = S.h;
    $("cap").value = d.summary.caption || "";
    if (d.summary.canvas) setCanvasType(d.summary.canvas);
    $("meta").value = (d.summary.meta || []).join(", ");
    $("pal").value = (d.summary.palette || []).join(", ");
    S.items = (d.items || []).map(it => ({
      label: it.label || "character",
      caption: it.caption || "",
      bbox: [...it.bbox],
      ...(it.text ? { text: it.text } : {})
    }));
    clampBoxes();
    renderCanvas();
    renderItemsList();
    compileAndUpdate();
    saveState();
    toast(`成功解析并导入 ${S.items.length} 个元素画框！`);
    switchPage("cv");
  } catch (err) {
    toast("导入失败: " + err.message);
  }
}

function exportDraft() {
  const d = collectCurrentDraft();
  $("jsIn").value = JSON.stringify(d, null, 2);
  toast("草稿代码已导出到文本框");
  switchPage("js");
}

/* ================= 本地持久化缓存 ================= */
function saveState() {
  localStorage.setItem("mossDraft", JSON.stringify({
    w: S.w,
    h: S.h,
    canvas: S.canvas,
    cap: $("cap").value,
    meta: $("meta").value,
    pal: $("pal").value,
    items: S.items
  }));
}

function restoreState() {
  try {
    const d = JSON.parse(localStorage.getItem("mossDraft") || "null");
    if (!d) return;
    S.w = d.w || 896;
    S.h = d.h || 1152;
    S.canvas = d.canvas || "single";
    $("W").value = S.w;
    $("H").value = S.h;
    $("cap").value = d.cap || "";
    $("meta").value = d.meta || "";
    $("pal").value = d.pal || "";
    setCanvasType(S.canvas);
    S.items = (d.items || []).map(it => ({ ...it, bbox: [...it.bbox] }));
  } catch (_) {}
}

/* 输入框事件监听 */
$("cap").oninput = () => { compileAndUpdate(); saveState(); };
$("meta").oninput = () => { compileAndUpdate(); saveState(); };
$("pal").oninput = () => { compileAndUpdate(); saveState(); };

/* 初始化运行 */
restoreState();
renderCanvas();
renderItemsList();
compileAndUpdate();

/* 原生应用桥接接收采样器真实尺寸 */
window.__nmSetSize = function(w, h) {
  try {
    if (typeof w !== "number" || typeof h !== "number" || !sizeOk(w) || !sizeOk(h)) return;
    S.w = w; S.h = h;
    $("W").value = w; $("H").value = h;
    clampBoxes();
    renderCanvas();
    renderItemsList();
    compileAndUpdate();
    saveState();
    toast("已同步采样器分辨率 " + w + "×" + h);
  } catch (_) {}
};
</script>
